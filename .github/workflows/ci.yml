name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13", "3.14", "3.15"]
        include:
          # Also test free-threaded Python on Linux (GIL disabled)
          # This is important for catching thread-safety issues in StateManager
          - os: ubuntu-latest
            python-version: "3.14t"

    env:
      # Overrides .python-version, which would otherwise win. A trailing "t"
      # requests a free-threaded build; uv downloads GIL builds otherwise, and
      # the "Check interpreter build" step below verifies which one we got.
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # setup-uv no longer publishes floating major tags, so pin a commit
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Check interpreter build
        shell: bash
        run: |
          uv run python - "${{ matrix.python-version }}" <<'EOF'
          import sys, sysconfig
          import solara_state  # GIL may be re-enabled by extension modules on import
          free_threaded = bool(sysconfig.get_config_var("Py_GIL_DISABLED"))
          gil_enabled = getattr(sys, "_is_gil_enabled", lambda: True)()
          print(sys.version, "| free-threaded build:", free_threaded, "| GIL enabled:", gil_enabled)
          want_free_threaded = sys.argv[1].endswith("t")
          sys.exit(0 if free_threaded == want_free_threaded and gil_enabled != want_free_threaded else 1)
          EOF

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

      - name: Run tests with warnings as errors
        run: uv run pytest tests/ -v --tb=short -W error::UserWarning
